<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#07111f" />
    <meta name="description" content="InvestGuard — AI/ML Behavioral Investment Analysis Platform for Hefty Hacks 2026." />
    <title>InvestGuard · AI/ML Behavioral Investment Platform</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=JetBrains+Mono:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="toast-root" aria-live="polite"></div>
    <div class="app-shell">
      <!-- SIDEBAR NAVIGATION -->
      <aside class="sidebar" id="sidebar">
        <div class="brand-row" data-route="landing" title="InvestGuard Home">
          <div class="brand-mark"><span></span><span></span><span></span></div>
          <div class="brand-name">Invest<span>Guard</span></div>
          <button class="icon-btn sidebar-close" data-action="close-sidebar" aria-label="Close menu">×</button>
        </div>
        
        <div class="demo-pill">
          <span class="pulse-dot"></span>
          <div>
            <strong>Hefty Hacks 2026</strong>
            <small>Finance × Trading Track</small>
          </div>
          <button class="switch-btn" data-action="reset-demo" title="Reset Demo Data">↻</button>
        </div>

        <nav class="main-nav" aria-label="Main navigation">
          <div class="nav-label">Workspace</div>
          <button class="nav-item active" data-route="dashboard"><span class="nav-icon">⌂</span>Overview</button>
          <button class="nav-item" data-route="portfolio"><span class="nav-icon">◫</span>Portfolio</button>
          <button class="nav-item" data-route="transactions"><span class="nav-icon">⇄</span>Transactions <em class="nav-count tx-count">10</em></button>
          <button class="nav-item" data-route="analysis"><span class="nav-icon">◌</span>Behavior Analysis</button>
          <button class="nav-item" data-route="alerts"><span class="nav-icon">♢</span>Smart Alerts <em class="nav-count alert-count">3</em></button>
          
          <div class="nav-label spaced">Plan & Reflect</div>
          <button class="nav-item" data-route="journal"><span class="nav-icon">▤</span>Investment Journal</button>
          <button class="nav-item" data-route="planner"><span class="nav-icon">⌁</span>Investment Planner</button>
          <button class="nav-item" data-route="learn"><span class="nav-icon">✦</span>Learn</button>
          
          <div class="nav-label spaced">Hackathon Submission</div>
          <button class="nav-item doc-item" data-route="docs"><span class="nav-icon">📄</span>Docs & Project Report</button>
        </nav>

        <div class="sidebar-footer">
          <div class="privacy-note">
            <span>🛡️</span>
            <p>Non-advisory educational platform.<br /><a href="#" data-route="docs">Read Hackathon Report ↗</a></p>
          </div>
          <div class="profile-row">
            <div class="avatar">IG</div>
            <div>
              <strong>Team InvestGuard</strong>
              <small>Hefty Hacks 2026</small>
            </div>
          </div>
        </div>
      </aside>

      <!-- MAIN CONTENT WRAPPER -->
      <main class="main-content">
        <header class="topbar">
          <button class="icon-btn mobile-menu" data-action="open-sidebar" aria-label="Open menu">☰</button>
          <div class="breadcrumb">
            <span>InvestGuard</span><b>/</b><strong id="breadcrumb-current">Overview</strong>
          </div>
          <div class="top-actions">
            <div class="data-status">
              <span class="status-dot"></span>Isolation Forest Model Active <i>ⓘ</i>
            </div>
            <button class="btn btn-small btn-ghost doc-badge-btn" data-route="docs">
              📄 Project Report & README
            </button>
            <div class="top-avatar">IG</div>
          </div>
        </header>

        <div class="page-wrap" id="page-wrap"></div>
      </main>
    </div>

    <!-- MODAL DIALOG -->
    <div class="modal-backdrop" id="modal-backdrop" hidden>
      <section class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title"></section>
    </div>

    <script src="docsData.js"></script>
    <script src="app.js"></script>
  </body>
</html>
